<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌱 Ecosystem Tycoon — Live</title>
<style>
  :root {
    --bg: #fdf3e7;
    --bg2: #fbeed9;
    --card: #ffffff;
    --ink: #3d3225;
    --dim: #8a7a66;
    --border: #f0e2cc;
    --accent: #e8833a;
    --accent-soft: #fdebd3;
    --green: #2e9e5b;
    --green-soft: #ddf3e5;
    --red: #d64545;
    --red-soft: #fbe3e3;
    --amber: #c77f0a;
    --amber-soft: #fdf0d0;
    --blue: #3a7bd5;
    --blue-soft: #e0edfb;
    --purple: #8a5fc0;
    --purple-soft: #ece2f8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 20% 10%, #fdeeda 0, transparent 40%),
                      radial-gradient(circle at 85% 90%, #fbe3c8 0, transparent 35%);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #hud {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 22px; background: #fffaf0;
    border-bottom: 3px solid var(--border);
    position: sticky; top: 0; z-index: 10; flex-wrap: wrap;
  }
  #hud .title { font-size: 22px; font-weight: 800; letter-spacing: .5px; }
  #tick-badge {
    background: var(--ink); color: #fff; font-weight: 800; font-size: 13px;
    letter-spacing: 1px; padding: 6px 16px; border-radius: 999px;
  }
  .hud-stat { display: flex; flex-direction: column; min-width: 86px; }
  .hud-stat .label { font-size: 10px; text-transform: uppercase; color: var(--dim); letter-spacing: 1px; font-weight: 700; }
  .hud-stat .value { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  #verdict-chip {
    margin-left: auto; padding: 7px 16px; border-radius: 999px;
    font-weight: 800; font-size: 13px; letter-spacing: .5px; border: 2px solid;
  }
  #verdict-chip.ON_TRACK { color: var(--green); border-color: var(--green); background: var(--green-soft); }
  #verdict-chip.BEHIND { color: var(--amber); border-color: var(--amber); background: var(--amber-soft); }
  #verdict-chip.STOP_LOSS { color: var(--red); border-color: var(--red); background: var(--red-soft); animation: wiggle 1s infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-3deg); } 75% { transform: rotate(3deg); } }
  #live-wrap { display: flex; align-items: center; gap: 6px; }
  #live-dot { width: 12px; height: 12px; border-radius: 50%; background: #d8cbb6; display: inline-block; }
  #live-dot.on { background: var(--green); box-shadow: 0 0 10px var(--green); animation: pop .5s; }
  @keyframes pop { 0% { transform: scale(1.7); } 100% { transform: scale(1); } }
  #live-label { font-size: 11px; color: var(--dim); letter-spacing: 2px; font-weight: 800; }
  #error-banner {
    display: none; background: var(--red-soft); border-bottom: 2px solid var(--red);
    color: var(--red); padding: 10px 22px; font-size: 13px; font-weight: 600;
  }
  #error-banner.show { display: block; }
  #main { padding: 18px 22px 8px; flex: 1; max-width: 1400px; width: 100%; margin: 0 auto; }
  .panel-title { font-size: 17px; font-weight: 800; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
  #stations { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 1100px) { #stations { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { #stations { grid-template-columns: 1fr; } }
  .char-card {
    background: var(--card); border: 2px solid var(--border); border-radius: 20px;
    padding: 16px 14px 12px; text-align: center;
    box-shadow: 0 4px 14px rgba(180, 130, 70, .10);
    transition: transform .15s, box-shadow .4s, border-color .4s;
  }
  .char-card:hover { transform: translateY(-2px); }
  .char-card.flash { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), 0 6px 18px rgba(232, 131, 58, .35); }
  .char-emoji { font-size: 52px; line-height: 1; display: inline-block; }
  .char-card.working .char-emoji { animation: bounce .7s infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-8px) rotate(4deg); } }
  .char-name { font-size: 17px; font-weight: 800; margin-top: 8px; }
  .char-role { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--dim); margin-bottom: 8px; }
  .char-status { font-size: 13px; font-weight: 600; color: var(--dim); min-height: 20px; margin-bottom: 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .char-card.working .char-status { color: var(--accent); font-weight: 800; }
  .char-stats { display: flex; justify-content: center; gap: 14px; border-top: 2px dashed var(--border); padding-top: 8px; font-size: 12px; }
  .char-stats .s { display: flex; flex-direction: column; }
  .char-stats .s-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); font-weight: 700; }
  .char-stats .s-value { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 14px; }
  .char-big { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; border-top: 2px dashed var(--border); padding-top: 8px; }
  .char-sub { font-size: 12px; color: var(--dim); font-weight: 600; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #lower { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 900px) { #lower { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 2px solid var(--border); border-radius: 20px; padding: 16px;
    box-shadow: 0 4px 14px rgba(180, 130, 70, .10); }
  .panel h2 { font-size: 15px; font-weight: 800; margin-bottom: 12px; }
  .biz-row { display: flex; align-items: center; gap: 10px; background: var(--bg);
    border: 2px solid var(--border); border-radius: 14px; padding: 10px 14px; margin-bottom: 8px; }
  .biz-row .biz-emoji { font-size: 26px; }
  .biz-row .biz-info { flex: 1; min-width: 0; }
  .biz-row .biz-name { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .biz-row .biz-type { font-size: 11px; color: var(--dim); font-weight: 600; }
  .status-badge { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px;
    padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
  .status-badge.researching { background: var(--blue-soft); color: var(--blue); }
  .status-badge.validated { background: var(--purple-soft); color: var(--purple); }
  .status-badge.approved, .status-badge.live, .status-badge.operating { background: var(--green-soft); color: var(--green); }
  .status-badge.building { background: var(--amber-soft); color: var(--amber); }
  .status-badge.paused, .status-badge.shut_down { background: var(--red-soft); color: var(--red); }
  .status-badge.proposed, .status-badge.discovered { background: var(--bg2); color: var(--dim); }
  .biz-profit { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 15px; }
  .empty-note { color: var(--dim); font-style: italic; padding: 14px; text-align: center; }
  #events-panel { max-height: 420px; display: flex; flex-direction: column; }
  #events-feed { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .event-row { background: var(--bg); border: 2px solid var(--border); border-radius: 12px;
    padding: 8px 12px; font-size: 13px; line-height: 1.4; }
  .event-row .e-voice { font-weight: 600; }
  .event-row .e-meta { font-size: 11px; color: var(--dim); font-weight: 600; margin-top: 2px; }
  .event-row.fresh { border-color: var(--accent); background: var(--accent-soft); }
  #exp001 { margin-top: 14px; }
  #exp001.hidden { display: none; }
  .exp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  @media (max-width: 560px) { .exp-grid { grid-template-columns: repeat(2, 1fr); } }
  .exp-cell { background: var(--bg); border: 2px solid var(--border); border-radius: 14px; padding: 10px 12px; text-align: center; }
  .exp-cell .label { font-size: 10px; text-transform: uppercase; color: var(--dim); letter-spacing: 1px; font-weight: 800; }
  .exp-cell .value { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #exp-triggers { list-style: none; }
  #exp-triggers li { font-size: 13px; font-weight: 600; color: var(--red); background: var(--red-soft);
    border-radius: 10px; padding: 8px 12px; margin-top: 6px; }
  #exp-triggers li.ok { color: var(--green); background: var(--green-soft); }
  #controls {
    display: flex; align-items: center; gap: 10px; padding: 14px 22px;
    background: #fffaf0; border-top: 3px solid var(--border);
    position: sticky; bottom: 0; flex-wrap: wrap;
    max-width: 1400px; width: 100%; margin: 18px auto 0;
    border-left: 3px solid var(--border); border-right: 3px solid var(--border);
    border-radius: 20px 20px 0 0;
  }
  button, select {
    background: var(--card); color: var(--ink); border: 2px solid var(--border);
    border-radius: 999px; padding: 10px 20px; font-size: 14px; font-weight: 800;
    cursor: pointer; font-family: inherit;
  }
  button:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
  button:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--card); border-color: var(--red); color: var(--red); }
  button.active-toggle { background: var(--green); border-color: var(--green); color: #fff; }
  #controls .spacer { flex: 1; }
  #controls .hint { font-size: 12px; color: var(--dim); font-weight: 600; }

  /* ---------- mobile (phone-first: 390px and up) ---------- */
  body { overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
  @media (max-width: 560px) {
    #main { padding: 14px 14px 8px; }
    #hud { padding: 10px 14px; gap: 10px; }
    #hud .title { font-size: 18px; }
    #tick-badge { font-size: 11px; padding: 5px 12px; }
    .hud-stat { min-width: 68px; }
    .hud-stat .value { font-size: 17px; }
    #verdict-chip { margin-left: 0; font-size: 12px; padding: 6px 12px; }
    .panel-title { font-size: 15px; margin: 14px 0 8px; }
    .char-emoji { font-size: 44px; }
    .char-card { padding: 14px 10px 10px; }
    .char-name { font-size: 15px; }
    #events-panel { max-height: 320px; }
    .exp-cell { padding: 8px 8px; }
    .exp-cell .value { font-size: 17px; }
    .biz-row { padding: 10px 12px; gap: 8px; }
    .biz-row .biz-emoji { font-size: 22px; }
    #controls { padding: 12px 14px; gap: 8px; }
    #controls > button, #controls > select { flex: 1 1 44%; min-height: 48px; font-size: 15px; }
    #controls .spacer { display: none; }
    #controls .hint { flex-basis: 100%; text-align: center; }
  }
</style>
</head>
<body>
<header id="hud">
  <div class="title">🌱 Ecosystem Tycoon</div>
  <div id="tick-badge">TICK –</div>
  <div class="hud-stat"><span class="label">Revenue</span><span class="value" id="hud-revenue">–</span></div>
  <div class="hud-stat"><span class="label">Costs</span><span class="value" id="hud-costs">–</span></div>
  <div class="hud-stat"><span class="label">Net profit</span><span class="value" id="hud-profit">–</span></div>
  <div id="verdict-chip" style="display:none"></div>
  <div id="live-wrap"><span id="live-dot"></span><span id="live-label">LIVE</span></div>
</header>
<div id="error-banner"></div>
<div id="main">
  <div class="panel-title">⭐ Your Crew</div>
  <section id="stations"></section>
  <div id="lower">
    <div class="panel" id="businesses-panel">
      <h2>🏪 Businesses</h2>
      <div id="businesses-list"></div>
    </div>
    <div class="panel" id="events-panel">
      <h2>📣 What Just Happened</h2>
      <div id="events-feed"></div>
    </div>
  </div>
  <div class="panel" id="exp001">
    <h2>🧪 Experiment 001 — Evergreen Planners</h2>
    <div class="exp-grid">
      <div class="exp-cell"><div class="label">Day</div><div class="value" id="exp-day">–</div></div>
      <div class="exp-cell"><div class="label">Pace</div><div class="value" id="exp-pace">–</div></div>
      <div class="exp-cell"><div class="label">Verdict</div><div class="value" id="exp-verdict">–</div></div>
      <div class="exp-cell"><div class="label">Orders</div><div class="value" id="exp-orders">–</div></div>
      <div class="exp-cell"><div class="label">Revenue</div><div class="value" id="exp-revenue">–</div></div>
      <div class="exp-cell"><div class="label">Spend</div><div class="value" id="exp-spend">–</div></div>
    </div>
    <ul id="exp-triggers"></ul>
  </div>
</div>
<footer id="controls">
  <button id="btn-step" class="primary">⏭ Step</button>
  <button id="btn-auto">▶ Auto</button>
  <select id="speed" title="Auto speed">
    <option value="4000">1×</option>
    <option value="2000">2×</option>
    <option value="1000">4×</option>
  </select>
  <button id="btn-pause">⏸ Pause</button>
  <button id="btn-reset" class="danger">↺ Reset</button>
  <span class="spacer"></span>
  <span class="hint">Step = one real orchestrator tick · Auto runs ticks on the speed interval</span>
</footer>
<script>
"use strict";

/* ---------------- helpers ---------------- */
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v == null ? "" : v)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const fmtUSD = (n) => {
  const v = Number(n) || 0;
  return (v < 0 ? "-$" : "$") + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
const fmtInt = (n) => (Number(n) || 0).toLocaleString("en-US");
const fmtTime = (ts) => {
  if (ts == null || ts === "") return "";
  const ms = Number(ts);
  if (!isNaN(ms)) {
    const t = ms < 1e12 ? ms * 1000 : ms;
    return new Date(t).toLocaleTimeString("en-US", { hour12: false });
  }
  const d = new Date(ts);
  return isNaN(d) ? "" : d.toLocaleTimeString("en-US", { hour12: false });
};

/* ---------------- the crew (fixed roster) ---------------- */
const ROSTER = [
  { name: "Scout",   emoji: "🔭", role: "Discovery",   agentType: "discovery" },
  { name: "Analyst", emoji: "🔬", role: "Research",    agentType: "research" },
  { name: "Builder", emoji: "🛠️", role: "Product",     agentType: null },
  { name: "Studio",  emoji: "🎨", role: "Creative",    agentType: "creative" },
  { name: "Growth",  emoji: "📣", role: "Marketing",   agentType: "marketing" },
  { name: "Care",    emoji: "💬", role: "Support",     agentType: "support" },
  { name: "Ops",     emoji: "⚙️", role: "Operations",  agentType: "operations" },
  { name: "Ledger",  emoji: "📒", role: "Finance",     agentType: null },
];
// Agent types that actually execute work during a tick (see ecosystem/worker.py run_tick)
const TICK_WORKERS = ["discovery", "research"];
const VERDICT_LABEL = { ON_TRACK: "🟢 ON TRACK", BEHIND: "🟡 BEHIND", STOP_LOSS: "🔴 STOP LOSS" };

/* ---------------- state ---------------- */
const state = {
  snapshot: null,
  prevTasks: {},       // agentType -> tasks_completed, for flash highlight
  auto: false,
  autoTimer: null,
  tickInFlight: false,
};

/* ---------------- api ---------------- */
async function api(path, method) {
  const res = await fetch(path, { method: method || "GET" });
  if (!res.ok) throw new Error("HTTP " + res.status + " on " + path);
  return res.json();
}
function showError(msg) {
  const b = $("error-banner");
  b.textContent = "⚠ Can't reach the game server: " + msg + " — retrying…";
  b.classList.add("show");
}
function hideError() { $("error-banner").classList.remove("show"); }
function pulseLive() {
  const d = $("live-dot");
  d.classList.remove("on");
  void d.offsetWidth;
  d.classList.add("on");
}

/* ---------------- render ---------------- */
function render(snapshot) {
  state.snapshot = snapshot;
  renderHUD(snapshot);
  renderStations(snapshot);
  renderBusinesses(snapshot.businesses || []);
  renderEvents(snapshot.events || []);
  renderExperiment(snapshot.experiment_001);
  pulseLive();
}

function renderHUD(s) {
  $("tick-badge").textContent = "TICK " + (s.tick != null ? s.tick : "–");
  const t = s.totals || {};
  $("hud-revenue").textContent = fmtUSD(t.revenue);
  $("hud-costs").textContent = fmtUSD(t.total_costs);
  const p = $("hud-profit");
  p.textContent = fmtUSD(t.net_profit);
  p.className = "value " + ((Number(t.net_profit) || 0) >= 0 ? "pos" : "neg");
  const chip = $("verdict-chip");
  const e = s.experiment_001;
  if (e && e.verdict) {
    chip.style.display = "";
    chip.className = e.verdict;
    chip.textContent = VERDICT_LABEL[e.verdict] || e.verdict;
  } else {
    chip.style.display = "none";
  }
}

function renderStations(s) {
  const wrap = $("stations");
  const byType = {};
  for (const a of (s.agents || [])) byType[String(a.type || "").toLowerCase()] = a;
  const totals = s.totals || {};
  const businesses = s.businesses || [];
  wrap.innerHTML = "";
  for (const c of ROSTER) {
    const card = document.createElement("div");
    card.className = "char-card";
    let inner = '<div class="char-emoji">' + c.emoji + "</div>" +
      '<div class="char-name">' + esc(c.name) + "</div>" +
      '<div class="char-role">' + esc(c.role) + "</div>";

    if (c.agentType) {
      // Real agent station: stats come from the API's agents array.
      const a = byType[c.agentType] || {};
      const tasks = Number(a.tasks_completed) || 0;
      const prev = state.prevTasks[c.agentType];
      const increased = prev != null && tasks > prev;
      state.prevTasks[c.agentType] = tasks;
      const working = state.tickInFlight && TICK_WORKERS.indexOf(c.agentType) !== -1;
      if (working) card.classList.add("working");
      if (increased) card.classList.add("flash");
      const statusText = working ? "Working…" : (a.last_task ? a.last_task : "Standing by");
      inner += '<div class="char-status"' +
        ((a.last_task && !working) ? ' title="' + esc(a.last_task) + '"' : "") + ">" +
        (working ? "⚡ " : "▸ ") + esc(statusText) + "</div>";
      inner += '<div class="char-stats">' +
        '<div class="s"><span class="s-label">Tasks ✓</span><span class="s-value">' + fmtInt(tasks) + "</span></div>" +
        '<div class="s"><span class="s-label">Tokens</span><span class="s-value">' + fmtInt(a.tokens_used) + "</span></div>" +
        '<div class="s"><span class="s-label">Cost</span><span class="s-value">' + fmtUSD(a.cost_usd) + "</span></div>" +
        "</div>";
      if (increased) setTimeout(() => card.classList.remove("flash"), 1400);
    } else if (c.name === "Builder") {
      // Product station: derived from totals + businesses (no agent_type).
      const n = Number(totals.businesses) || 0;
      const latest = businesses.length ? businesses[businesses.length - 1] : null;
      inner += '<div class="char-big">' + fmtInt(n) + ' <span style="font-size:14px">🏪</span></div>' +
        '<div class="char-sub" title="' + esc(latest ? latest.name : "") + '">' +
        esc(latest ? "Latest: " + latest.name : "No businesses yet — press Step") + "</div>";
    } else {
      // Ledger station: real ledger totals (no agent_type).
      const profit = Number(totals.net_profit) || 0;
      inner += '<div class="char-stats">' +
        '<div class="s"><span class="s-label">Revenue</span><span class="s-value pos">' + fmtUSD(totals.revenue) + "</span></div>" +
        '<div class="s"><span class="s-label">Costs</span><span class="s-value">' + fmtUSD(totals.total_costs) + "</span></div>" +
        '<div class="s"><span class="s-label">Net</span><span class="s-value ' + (profit >= 0 ? "pos" : "neg") + '">' + fmtUSD(profit) + "</span></div>" +
        "</div>";
    }
    card.innerHTML = inner;
    wrap.appendChild(card);
  }
}

function renderBusinesses(businesses) {
  const wrap = $("businesses-list");
  wrap.innerHTML = "";
  if (!businesses.length) {
    wrap.innerHTML = '<div class="empty-note">No businesses yet — press Step and the crew will get to work! 🚀</div>';
    return;
  }
  for (const b of businesses) {
    const profit = Number(b.net_profit) || 0;
    const row = document.createElement("div");
    row.className = "biz-row";
    row.innerHTML =
      '<span class="biz-emoji">🏪</span>' +
      '<div class="biz-info"><div class="biz-name">' + esc(b.name) + "</div>" +
      '<div class="biz-type">' + esc(b.business_type || "") + "</div></div>" +
      '<span class="status-badge ' + esc(String(b.status || "").toLowerCase()) + '">' + esc(b.status || "?") + "</span>" +
      '<div class="biz-profit ' + (profit >= 0 ? "pos" : "neg") + '">' + fmtUSD(profit) + "</div>";
    wrap.appendChild(row);
  }
}

function eventVoice(e) {
  // Game-voice interpretations of real audit events (newest data wins).
  const r = e.result;
  if (r && r.winner != null) {
    const tick = (r.tick != null) ? "T" + r.tick + " · " : "";
    return tick + "Analyst ranked the opportunities — '" + r.winner + "' wins (" + r.score + ")";
  }
  if (e.event === "stop_loss_triggered") return "⛔ Stop-loss triggered — check Experiment 001!";
  if (e.event === "tick_completed") {
    const who = e.actor === "game" ? "The crew" : (e.actor || "Someone");
    return who + " finished a tick" + (e.business_id ? " and launched a business! 🎉" : ".");
  }
  return (e.actor || "system") + " — " + (e.event || "");
}

function renderEvents(events) {
  const feed = $("events-feed");
  feed.innerHTML = "";
  let shown = 0;
  for (const e of events) {  // API sends newest-first already
    if (shown >= 100) break;
    const row = document.createElement("div");
    row.className = "event-row" + (shown === 0 ? " fresh" : "");
    const metaBits = [];
    const t = fmtTime(e.ts);
    if (t) metaBits.push(t);
    const ids = [e.business_id, e.task_id].filter(Boolean).join(" · ");
    if (ids) metaBits.push(ids);
    row.innerHTML = '<div class="e-voice">' + esc(eventVoice(e)) + "</div>" +
      (metaBits.length ? '<div class="e-meta">' + esc(metaBits.join(" · ")) + "</div>" : "");
    feed.appendChild(row);
    shown++;
  }
  if (!shown) feed.innerHTML = '<div class="empty-note">Quiet… for now. Press Step! 🎲</div>';
  feed.scrollTop = 0;
}

function renderExperiment(e) {
  const panel = $("exp001");
  if (!e) { panel.classList.add("hidden"); return; }
  panel.classList.remove("hidden");
  $("exp-day").textContent = e.days_elapsed + " / 60";
  $("exp-pace").textContent = (e.pace_pct != null ? e.pace_pct + "%" : "–");
  const v = $("exp-verdict");
  v.textContent = (VERDICT_LABEL[e.verdict] || e.verdict || "–");
  v.className = "value " + (e.verdict === "ON_TRACK" ? "pos" : e.verdict === "STOP_LOSS" ? "neg" : "");
  if (e.verdict === "BEHIND") v.style.color = "var(--amber)"; else v.style.color = "";
  $("exp-orders").textContent = fmtInt(e.orders);
  $("exp-revenue").textContent = fmtUSD(e.revenue_usd);
  $("exp-spend").textContent = fmtUSD(e.spend_usd);
  const ul = $("exp-triggers");
  ul.innerHTML = "";
  const triggers = e.stop_loss_triggers || [];
  if (!triggers.length) {
    const li = document.createElement("li");
    li.className = "ok";
    li.textContent = "✅ No stop-loss triggers active. Smooth sailing!";
    ul.appendChild(li);
  } else {
    for (const t of triggers) {
      const li = document.createElement("li");
      li.textContent = "⛔ " + t;
      ul.appendChild(li);
    }
  }
}

/* ---------------- actions ---------------- */
async function refresh() {
  try {
    const s = await api("/api/snapshot");
    hideError();
    render(s);
  } catch (err) {
    showError(err.message);
  }
}

async function doTick() {
  if (state.tickInFlight) return;
  state.tickInFlight = true;
  updateButtons();
  renderStations(state.snapshot || { agents: [], totals: {}, businesses: [] });
  try {
    const res = await api("/api/tick", "POST");
    hideError();
    render(res.snapshot || res);
  } catch (err) {
    showError(err.message);
  } finally {
    state.tickInFlight = false;
    updateButtons();
    if (state.snapshot) renderStations(state.snapshot);
  }
}

async function doReset() {
  if (!confirm("Reset the game? Your whole crew's progress will be lost!")) return;
  stopAuto();
  try {
    const res = await api("/api/reset", "POST");
    hideError();
    state.prevTasks = {};
    render(res.snapshot || res);
  } catch (err) {
    showError(err.message);
  }
}

function startAuto() {
  if (state.auto || state.tickInFlight) return;
  state.auto = true;
  const interval = Number($("speed").value) || 4000;
  const loop = async () => {
    if (!state.auto) return;
    await doTick();
    if (state.auto) state.autoTimer = setTimeout(loop, interval);
  };
  loop();
  updateButtons();
}

function stopAuto() {
  state.auto = false;
  if (state.autoTimer) { clearTimeout(state.autoTimer); state.autoTimer = null; }
  updateButtons();
}

function updateButtons() {
  $("btn-step").disabled = state.tickInFlight;
  $("btn-auto").disabled = state.tickInFlight || state.auto;
  $("btn-auto").classList.toggle("active-toggle", state.auto);
  $("btn-auto").textContent = state.auto ? "⏸ Auto ON" : "▶ Auto";
  $("btn-pause").disabled = !state.auto;
}

/* ---------------- wiring ---------------- */
$("btn-step").addEventListener("click", doTick);
$("btn-auto").addEventListener("click", startAuto);
$("btn-pause").addEventListener("click", stopAuto);
$("btn-reset").addEventListener("click", doReset);
$("speed").addEventListener("change", () => {
  if (state.auto) { stopAuto(); startAuto(); }
});

updateButtons();
refresh();
</script>
</body>
</html>
