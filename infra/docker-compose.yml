services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecosystem
      POSTGRES_PASSWORD: ecosystem
      POSTGRES_DB: ecosystem
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No initdb.d mount: the schema is created by `launch.py initdb`
    # (python -m infra.init_db), not by Postgres init scripts.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecosystem"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
